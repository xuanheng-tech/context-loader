name: release

# Synchronize an already-public release. The built-in Actions actor does not
# recursively trigger the older tag commit's workflow when backfilling a tag.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public vX.Y.Z tag (blank uses the project version)
        required: false

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Needed only for an exact missing tag, using the built-in job actor.
          token: ${{ github.token }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.1"
          enable-cache: false
          github-token: ""
      - run: uv python install 3.12.13
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.21.0"
          github-token: ""
      - name: Shared quality gate
        run: just check
      - name: Audit current refs, Releases and workflow runs
        env:
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import os
          from scripts.release import api

          root = os.environ["RELEASE_API_URL"].rstrip("/") + "/repos/" + os.environ["RELEASE_REPOSITORY"]
          fields = ("id", "name", "tag_name", "target_commitish", "draft", "prerelease",
                    "head_sha", "head_branch", "event", "status", "conclusion", "workflow_id",
                    "run_number", "created_at", "published_at", "html_url")
          for route in ("branches", "tags", "releases", "actions/runs"):
              objects = []
              for page in range(1, 11):
                  data = api(f"{root}/{route}?limit=100&page={page}", token=os.environ["RELEASE_TOKEN"])
                  rows = data["workflow_runs"] if route == "actions/runs" else data
                  if not isinstance(rows, list):
                      raise SystemExit("release audit response is unavailable")
                  for row in rows:
                      item = {key: row[key] for key in fields if key in row}
                      if "commit" in row:
                          item["commit"] = row["commit"].get("sha") or row["commit"].get("id")
                      objects.append(item)
                  if len(rows) < 100:
                      break
              else:
                  raise SystemExit("release audit exceeds 1000 objects; inspect explicitly")
              print(json.dumps({"release_audit": route, "objects": objects}, sort_keys=True))
          PY
      - name: Verify public identity and close Gitea records
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TOKEN: ${{ github.token }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(uv run --no-sync python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          uv run --no-sync python scripts/release.py sync-gitea "$RELEASE_TAG" \
            --api-url "$RELEASE_API_URL" --repository "$RELEASE_REPOSITORY"
