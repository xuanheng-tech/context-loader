name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv python install 3.12.13
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Verify tag, run just check, and build only an unpublished version
        id: build
        run: uv run --no-sync python scripts/release.py build "$GITHUB_REF_NAME" --expected-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.build.outputs.built == 'true'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv python install 3.12.13
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - name: Compare existing files and select only missing original artifacts
        id: pending
        run: uv run --no-sync python scripts/release.py pending-dist "$GITHUB_REF_NAME" --expected-sha "$GITHUB_SHA"
      # Each distribution is its own PyPI project, so each upload performs its own
      # Trusted Publishing exchange from this one approved environment.
      - name: Publish context-loader
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.pending.outputs.pending_context_loader == 'true'
        with:
          packages-dir: pending-dist/context-loader/
      - name: Publish codex-project-context-loader
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.pending.outputs.pending_codex_project_context_loader == 'true'
        with:
          packages-dir: pending-dist/codex-project-context-loader/
