[project]
name = "codex-project-context-loader"
version = "0.1.0"
description = "Render deterministic local Git context for Codex"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
