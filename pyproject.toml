[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "codex-project-context-loader"
version = "0.1.7"
description = "Render deterministic local Git context for Codex"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
codex-project-context = "context_loader.cli:main"

[project.urls]
Repository = "https://github.com/xuanheng-tech/context-loader"
Issues = "https://github.com/xuanheng-tech/context-loader/issues"

[tool.uv.build-backend]
module-name = "context_loader"
module-root = ""
# The declared public CLI contract ships with the source distribution so a
# package-only consumer can pin it; the wheel stays runtime-only.
source-include = ["tool_cli_contract.json"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
